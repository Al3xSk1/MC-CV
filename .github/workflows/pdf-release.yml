name: PDF Release

on:
  push:
    branches:
      - main
    paths:
      - CV.tex
      - .github/workflows/pdf-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdf-release
  cancel-in-progress: true

jobs:
  release:
    name: Build and release CV PDF
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            latexmk \
            lmodern \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-latex-recommended

      - name: Build PDF
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build CV.tex

      - name: Publish rolling PDF release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete cv-pdf --yes --cleanup-tag || true
          gh release create cv-pdf "build/CV.pdf#CV.pdf" \
            --title "Current CV PDF" \
            --notes "Automated build from ${GITHUB_SHA}." \
            --prerelease \
            --latest=false \
            --target "${GITHUB_SHA}"
